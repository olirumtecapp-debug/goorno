<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#073B32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GoOrNo — Aceitar ou Recusar? | Copiloto de Ganhos & Street View</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* First-Paint Splash Screen (Zero-Flicker Native Feel) */
      #initial-splash {
        position: fixed;
        inset: 0;
        background: #073B32;
        background: linear-gradient(180deg, #073B32 0%, #04251F 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      }
      .splash-card {
        width: 130px;
        height: 130px;
        background: #ffffff;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(16, 185, 129, 0.2);
        animation: splashPulse 2s ease-in-out infinite;
      }
      .splash-card img {
        width: 100%;
        height: auto;
        display: block;
      }
      .splash-title {
        color: #ffffff;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-top: 24px;
      }
      .splash-subtitle {
        color: #86EFAC;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        margin-top: 4px;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .splash-loader {
        width: 80px;
        height: 4px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        margin-top: 28px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: #10B981;
        border-radius: 999px;
        animation: splashSlide 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes splashSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body style="margin: 0; background: #073B32;">
    <div id="root">
      <div id="initial-splash">
        <div class="splash-card">
          <img src="/logo-goorno-clean.png" alt="GoOrNo" />
        </div>
        <div class="splash-title">GoOrNo</div>
        <div class="splash-subtitle">Copiloto Inteligente de Ganhos</div>
        <div class="splash-loader">
          <div class="splash-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
