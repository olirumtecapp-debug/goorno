name: GoOrNo Reading Test APK

on:
  push:
    branches:
      - fix/reading-gate-test-20261110
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Test and Build Isolated Reading APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Run unit tests and build test APK
        run: |
          cd android
          gradle testDebugUnitTest --stacktrace
          gradle assembleRelease --stacktrace
      - name: Copy test APK
        run: |
          mkdir -p reading-test-apk
          cp android/app/build/outputs/apk/release/app-release.apk reading-test-apk/GoOrNo-Leitura-TESTE.apk
      - name: Upload test APK (never production)
        uses: actions/upload-artifact@v4
        with:
          name: GoOrNo-Leitura-TESTE
          path: reading-test-apk/GoOrNo-Leitura-TESTE.apk
          retention-days: 30
      - name: Commit APK only to isolated test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reading-test-apk/GoOrNo-Leitura-TESTE.apk
          git commit -m "test(apk): isolated reading build [skip ci]" || exit 0
          git push origin HEAD:fix/reading-gate-test-20261110
