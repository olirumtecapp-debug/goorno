name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Native Kotlin APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Run Automated Unit Tests (JUnit) & Build APK
        run: |
          cd android
          gradle testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Prepare APK for Artifact
        run: |
          mkdir -p release-apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/GoOrNo-v3.3.19.apk
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/GoOrNo.apk
            cp android/app/build/outputs/apk/release/app-release.apk GoOrNo-v3.3.19.apk
            cp android/app/build/outputs/apk/release/app-release.apk GoOrNo.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/GoOrNo-v3.3.19.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/GoOrNo.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk GoOrNo-v3.3.19.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk GoOrNo.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoOrNo-APK-v3.3.19
          path: release-apk/*
          retention-days: 30

      - name: Push APK to main repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add GoOrNo-v3.3.19.apk GoOrNo.apk
          git commit -m "chore(release): publish GoOrNo-v3.3.19.apk [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"