name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Native Kotlin APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Run Automated Unit Tests (JUnit) & Build APK
        run: |
          cd android
          gradle testDebugUnitTest --info || {
            echo "================ UNIT TEST FAILURE REPORT ================"
            find . -name "*.xml" -exec cat {} +
            exit 1
          }
          gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APK for Artifact
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          echo "Building version: $VERSION_NAME"
          mkdir -p release-apk
          mkdir -p client/public
          mkdir -p dist/public
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$APK_SRC" "release-apk/GoOrNo-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "release-apk/GoOrNo.apk"
          cp "$APK_SRC" "GoOrNo-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "GoOrNo.apk"
          cp "$APK_SRC" "client/public/GoOrNo-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "client/public/GoOrNo.apk"
          cp "$APK_SRC" "dist/public/GoOrNo-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "dist/public/GoOrNo.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoOrNo-APK-v3.3.20
          path: release-apk/*
          retention-days: 30

      - name: Push APK to main repo
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "GoOrNo-v${VERSION_NAME}.apk" GoOrNo.apk "client/public/GoOrNo-v${VERSION_NAME}.apk" client/public/GoOrNo.apk
          git commit -m "chore(release): publish GoOrNo-v${VERSION_NAME}.apk [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"